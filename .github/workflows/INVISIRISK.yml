name: Ruby build mit invisiray
on:
  workflow_dispatch:

env:
  IR_API_URL: "https://app.stage.invisirisk.com"
  IR_APP_TOKEN: ${{ secrets.IR_API_KEY_STAGE }}

jobs:
  RUBY:
    runs-on: ubuntu-latest
    name: Run build
    steps:
      - name: Setup PSE
        uses: invisirisk/pse-action@dev-test
        with:
          api_url: ${{env.IR_API_URL}}
          app_token: ${{ env.IR_APP_TOKEN }}
          mode: docker-intercept

      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.1' # specify your Ruby version
          
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install  # If you have a Gemfile
          gem list # This will list all installed gems
          
      - name: Cleanup PSE
        if: always()
        uses: invisirisk/pse-action@develop
        with:
          cleanup: "true"
          debug: true
          
  gather_analytics:
       runs-on: ubuntu-latest
       name: Gather Analytics
       needs: RUBY
       if: always()
       steps:
       - name: Gather Status
         uses: invisirisk/pse-action@develop
         with:
          api_url: ${{env.IR_API_URL}}
          app_token: ${{ env.IR_APP_TOKEN }}
          send_job_status: "true"
